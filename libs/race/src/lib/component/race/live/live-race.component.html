@if (bids$ | async; as bids) {
  <ng-container>
    <mat-list>
      @for (bid of bids; track bid.player.uid) {
        <mat-list-item [style.transform]="transform(bid.player.uid)">
          <img matListItemAvatar height="40" width="40" [ngSrc]="bid.player.photoURL" [alt]="bid.player.displayName">
          <div matListItemTitle>
            <span>{{ bid.player.displayName }}</span>
            @let change = currentChange(bid.player.uid);
            @if (change) {
              <span class="float-right rounded-full mt-5 py-1 px-3" [class.bg-lime-700]="change > 0" [class.bg-red-700]="change < 0">
                  <fa-icon class="me-1" [icon]="['fas', change > 0 ? 'angle-up' : 'angle-down' ]" [fixedWidth]="true"/>
                {{ abs(change) }}
                </span>
            }
          </div>
          <div matListItemLine>{{ bid.points }} point</div>
        </mat-list-item>
      }
    </mat-list>
    <span class="mt-3">Sidst opdateret {{ latestUpdate | dateTime: 'HH:mm.ss' }}</span>
  </ng-container>
}
