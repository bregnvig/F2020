<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"/>
    <mat-card-title>Så er vi klar til 2026</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Så er første officielle træning overstået og vi mangler kun én mere træning før det går løs i Australien!
    </p>
    <p>
      Derfor er vi selvfølgelige også klar med en ny sæson her!
    </p>
    <p>
      <fa-icon [icon]="trophy" size="lg" class="mr-2"/>
      Og stort tillykke til <strong>Ulrik</strong> der vandt WBC i 2025!
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()"> LÆST </a>
  </mat-card-actions>
</mat-card>
