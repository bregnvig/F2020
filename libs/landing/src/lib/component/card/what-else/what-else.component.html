<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Uendlige løkke😱</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Det lykkes mig at lave en uendelig løkke, i forbindelse med at jeg forsøgte at opdatere <code>updatedAt</code> feltet.
    </p>
    <p>
      Det var også derfor at det var yderste vanskeligt at komme af med sit bud. Dette burde være på plads nu!
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
