<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Sammenlign bud</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Sammenlign bud har drillet lidt, specielt når der ikke var nogle resultater.
    </p>
    <p>
      Det burde virke bedre nu og man kan nu sammenligne både før og efter løbet.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
