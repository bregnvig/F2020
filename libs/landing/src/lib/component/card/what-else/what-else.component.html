<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Angular v18</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Så blev applikationen opdateret til Angular v18. Dette burde ikke give de store problemer, da der blot 
      er tale om en opgradering af applikationen. 
    </p>
    <p>
      Dog har jeg været nødt til at skifte time picker bibliotek, da det gamle ikke længere blev vedligeholdt
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
