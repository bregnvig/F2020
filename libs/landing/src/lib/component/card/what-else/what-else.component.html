<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="bug" size="2x"></fa-icon>
    <mat-card-title>Så burde live live spille!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Så kom der ægte data og en masse kører der udgik første omgange. Kører som historisk har haft den samme permanente numre🥵
    </p>
    <p>
      Det var jeg ikke lige forberedt på🪲 Det er jeg nu og jeg håber derfor vi er klar til live live på søndag. Jeg glæder mig🎉
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
