<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x" />
    <mat-card-title>Hvad er nyt</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Du kan nu få en notifikation 5 minutter før en træning, en kvalifikation, en sprint eller løbet starter</p>
    <p>Appen findes nu også i lyst. Du kan vælge lys, mørk eller som din enhed</p>
    <p>
      Begge dele vælger du i
      <a routerLink="../player">din profil</a>
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">LÆST</a>
  </mat-card-actions>
</mat-card>
