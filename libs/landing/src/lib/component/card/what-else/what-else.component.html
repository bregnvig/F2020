<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Live live mere robust!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Har optimeret netværkskaldene, så nu burde live live fungere mere stabilt.
    </p>
    <p>
      Data grundlaget giver stadig problemer, derfor det sene resultat🥵
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
