<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Mellemresultat</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Jeg kan nu indtaste mellemresultatet manuelt, hvilket betyder at vi nu får mellemresultatet kort efter kvalifikationen.
    </p>
    <p>
      Hvis jeg altså sidder og ser kvalifikation😁
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
