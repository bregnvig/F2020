<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>&#64;ngrx/signals</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Tilbage til <a href="https://ngrx.io/guide/signals">ngrx</a>. Denne gang til ngrx signals. Har droppet egen udviklet store og gået tilbage til ngrx.
    </p>
    <p>
      Dette kan som altid give problemer, men jeg har brug for at lære nu biblioteker, så vi må leve med det 😁
    </p>
    <p>
      Skriv til mig, hvis det driller!
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
