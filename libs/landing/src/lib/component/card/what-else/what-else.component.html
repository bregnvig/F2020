<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Sammenlign bud</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Nu kan du sammenligne to bud for at se hvad forskellen er!
    </p>
    <video controls autoplay muted loop class="mb-2">
      <source src="assets/comparebid.webm" type="video/mp4"/>
    </video>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
