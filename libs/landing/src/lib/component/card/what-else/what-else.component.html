<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"/>
    <mat-card-title>Hvad er nyt</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Live under løbet er blevet mere robust. Forbindelsen kommer selv igen, hvis den ryger, f.eks. når telefonen har været låst, og en enkelt fejl stopper ikke længere opdateringerne🏎️</p>
    <p>Og tak til Claude <fa-icon class="text-[#D97757]" [icon]="claude"/></p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()"> LÆST </a>
  </mat-card-actions>
</mat-card>
