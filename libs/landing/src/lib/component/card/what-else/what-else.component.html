<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Live live opdateret!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Har lavet live live om til sin egen side.
    </p>
    <p>
      En side som nu er responsive, og derfor giver et bedre overblik på bredere skærme.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
