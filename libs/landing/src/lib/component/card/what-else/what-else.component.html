<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Fejl rettet</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Der har været en række små fejl som bla. gjorde man ikke kunne se bud, før løbet var lukket. Plus nogle andre småting.
    </p>
    <p>
      Der har været problemet med at sende mails, men det burde virke igen. Nu får vi se, ellers skifter jeg til Gmail til at sende mails.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
