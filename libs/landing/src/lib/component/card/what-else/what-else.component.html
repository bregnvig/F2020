<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"/>
    <mat-card-title>Sammenlign bud</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Der har været virkelig meget bøvl med at bygge resultaterne det sidste stykke tid😿
    </p>
    <p>Det skyldes Hadjar! Og at folk derfor skiftede hold.</p>
    <p>I fremtiden vil hvert løb have sit eget sæt af hold, så et løb ikke påvirker et andet. Så kan vi igen få rettidige resultater🥳</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()"> LÆST </a>
  </mat-card-actions>
</mat-card>
