<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>ESBuild</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      For de teknisk interesseret, så er <a href="https://webpack.js.org/" target="_blank">webpack</a> udskiftet med
      <a href="https://esbuild.github.io/" target="_blank">esbuild</a>. Det betyder at bundling af javascript er meget hurtigere.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
