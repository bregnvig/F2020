<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="marker" size="2x"></fa-icon>
    <mat-card-title>Google Maps og fejl</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Google Maps er blevet opdateret til den seneste version. Det betyder asynkron indlæsning, og derfor bedre performance.
    </p>
    <p>
      Der var problemer med at tilføje en kører, Franco Colapinto, til et hold. Derfor virkede det ikke rigtigt at indsende bud!😒
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
