<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x" />
    <mat-card-title>Hvad er nyt</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>Jeg har selv prøvet live af, og det er blevet meget mere robust! Prøv det af</p>
    <p>Og så er der sket rigtig mange ting på live/re-live siden, så hvis du sidder og ser F1 live, så gå ind på siden og få tons af info</p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">LÆST</a>
  </mat-card-actions>
</mat-card>
