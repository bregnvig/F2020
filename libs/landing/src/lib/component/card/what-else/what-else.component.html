    <mat-card-title>Så burde live live spille!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Har optimeret netværkskaldene, så nu burde live live fungere mere stabilt. 
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
