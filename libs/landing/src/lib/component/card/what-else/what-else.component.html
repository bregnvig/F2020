<mat-card>
  <mat-card-header>
    <fa-icon mat-card-avatar [icon]="icon" size="2x"></fa-icon>
    <mat-card-title>Live live!</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>
      Man kan nu se live data fra løbet!
    </p>
    <video controls autoplay muted loop>
      <source src="assets/livelive.mp4" type="video/mp4"/>
    </video>
    <p class="pt-2">
      Det betyder at hvis du går ind på løbs side mens løbet er i gang, vil du kunne se resultatet opdateres løbende!
    </p>
    <p>
      Du vil også kunne gå ind på et tidligere løb og genopleve løbet som var det live! Wauw!
    </p>
  </mat-card-content>
  <mat-card-actions>
    <a mat-button (click)="dismissMessage()">
      LÆST
    </a>
  </mat-card-actions>
</mat-card>
