# Lints, tests and builds what a pull request to develop changes. Required to pass before the pull request can be merged,
# see .github/README.md
name: Test

on:
  pull_request:
    branches: [develop]

# A new push to the pull request stops the run of the previous one
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Compares the pull request with develop
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: develop

      - name: Lint and test what changed
        run: npx nx affected -t lint test

      # The firebase project only copies the secret .env of the functions, and the builder needs its environment with keys,
      # which a pull request does not have
      - name: Build what changed
        run: npx nx affected -t build --exclude=firebase,builder
