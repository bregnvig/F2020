# Node, Java and the dependencies, for the workflows that lint, test and build
name: Setup
description: Node, Java for the Firestore emulator, and node_modules from the cache when package-lock.json is unchanged

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The function tests start a Firestore emulator
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    # npm ci deletes node_modules and installs it again, so it only runs when the lock file has changed. Pull requests use the cache saved by
    # the deploy on develop, as a cache saved by a pull request is only seen by that pull request
    - id: node-modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

    - if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash

    # The emulator the function tests start is downloaded by firebase-tools, which is in the lock file
    - uses: actions/cache@v6
      with:
        path: ~/.cache/firebase/emulators
        key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
